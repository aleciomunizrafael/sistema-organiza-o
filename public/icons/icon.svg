<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Organiza — folha creme com fita terracota sobre fundo azul-marinho -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22345a"/>
      <stop offset="1" stop-color="#15223d"/>
    </linearGradient>
    <linearGradient id="tape" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d0724a"/>
      <stop offset="1" stop-color="#b9532f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#050a16" flood-opacity=".45"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- folha solta, levemente inclinada -->
  <g transform="rotate(-4 256 272)">
    <rect x="116" y="104" width="280" height="336" rx="16" fill="#fbf7ee" filter="url(#shadow)"/>
    <!-- linha de margem -->
    <rect x="164" y="104" width="4" height="336" fill="#e5a999"/>
    <!-- pauta -->
    <g fill="#1b2a47" opacity=".14">
      <rect x="116" y="196" width="280" height="4"/>
      <rect x="116" y="272" width="280" height="4"/>
      <rect x="116" y="348" width="280" height="4"/>
    </g>
    <!-- tarefa concluída -->
    <circle cx="203" cy="235" r="22" fill="#b34a27"/>
    <path d="M191 236l8 8 17-19" fill="none" stroke="#fff7ef" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="240" y="226" width="126" height="18" rx="9" fill="#1b2a47"/>
    <!-- tarefas pendentes -->
    <circle cx="203" cy="311" r="19" fill="none" stroke="#1b2a47" stroke-width="7"/>
    <rect x="240" y="302" width="100" height="18" rx="9" fill="#1b2a47" opacity=".55"/>
    <circle cx="203" cy="387" r="19" fill="none" stroke="#1b2a47" stroke-width="7"/>
    <rect x="240" y="378" width="72" height="18" rx="9" fill="#1b2a47" opacity=".35"/>
  </g>

  <!-- fita adesiva -->
  <g transform="rotate(4 256 100)">
    <rect x="190" y="76" width="132" height="44" rx="4" fill="url(#tape)" opacity=".96"/>
    <rect x="190" y="76" width="132" height="44" rx="4" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="3"/>
  </g>
</svg>
